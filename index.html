<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Takıma Kayıt Formu</title>
  <style>
    body {
      background-color: #313338;
      color: #dbdee1;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .kutu {
      background-color: #2b2d31;
      padding: 30px;
      border-radius: 10px;
      width: 350px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    h2 {
      color: #ffffff;
      text-align: center;
      margin-top: 0;
    }
    label {
      display: block;
      margin-top: 15px;
      font-size: 13px;
      font-weight: bold;
      color: #b5bac1;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      background-color: #1e1f22;
      border: 1px solid #1e1f22;
      border-radius: 5px;
      color: #ffffff;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background-color: #5865f2;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #4752c4;
    }
    #sonuc {
      margin-top: 15px;
      text-align: center;
      color: #23a55a;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

<div class="kutu">
  <h2>Sunucu Formu</h2>
  <form id="form">
    <label>Discord Nickin:</label>
    <input type="text" id="nick" placeholder="Örn: kral_34" required>

    <label>Kaç Topun Var?</label>
    <select id="kafa">
      <option>4</option>
      <option>2</option>
      <option>0</option>
    </select>

    <label>Sunucuya Ne Katacaksın?</label>
    <textarea id="katki" rows="3" placeholder="Boş yapmaya geldim..."></textarea>

    <button type="submit" id="btn">Gönder Gitsin</button>
  </form>
  <div id="sonuc"></div>
</div>

<script>
  document.getElementById('form').addEventListener('submit', function(e) {
    e.preventDefault();

    const webhookURL = "https://discord.com/api/webhooks/1571916041963962421/xkXEfV_e4jHEt84uTNpZWeCVW-6MabNYOyAhjiNpmt4FLMg_NDHRiRYc8D3Yg0NAAbZ0";

    const nick = document.getElementById('nick').value;
    const topSayisi = document.getElementById('kafa').value;
    const katki = document.getElementById('katki').value || "Boş bırakmış";
    const btn = document.getElementById('btn');
    const sonuc = document.getElementById('sonuc');

    btn.disabled = true;
    btn.innerText = "Gönderiliyor...";

    const mesaj = {
      username: "Form Botu",
      embeds: [{
        title: "📋 Yeni Sunucu Formu Geldi!",
        color: 5793266,
        fields: [
          { name: "Discord Nicki", value: nick, inline: true },
          { name: "Kaç Topu Var?", value: topSayisi, inline: true },
          { name: "Sunucuya Ne Katacak?", value: katki }
        ],
        timestamp: new Date()
      }]
    };

    fetch(webhookURL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(mesaj)
    })
    .then(response => {
      if (response.ok) {
        sonuc.style.display = 'block';
        sonuc.style.color = '#23a55a';
        sonuc.innerText = "Tamamdır " + nick + ", formun kayda geçti. Sunucuya geçebilirsin!";
        document.getElementById('form').reset();
      } else {
        throw new Error("Hata");
      }
    })
    .catch(() => {
      sonuc.style.display = 'block';
      sonuc.style.color = '#da373c';
      sonuc.innerText = "Bir hata oluştu kanka, gönderilemedi!";
    })
    .finally(() => {
      btn.disabled = false;
      btn.innerText = "Gönder Gitsin";
    });
  });
</script>

</body>
</html>
